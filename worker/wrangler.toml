# Cloudflare Worker 배포 설정 (wrangler CLI를 쓸 때만 필요합니다)
#
#   npx wrangler secret put DATA_GO_KR_SERVICE_KEY --config worker/wrangler.toml
#   npx wrangler deploy --config worker/wrangler.toml
#
# 대시보드에 regions-worker.js를 붙여넣어 만들 거라면 이 파일은 무시해도 됩니다.

name = "soerp-region-api"
main = "regions-worker.js"
compatibility_date = "2025-01-01"

# 정적 사이트보다 먼저 /api/* 를 가로챕니다.
# zone_name은 Cloudflare에 등록된 영역(도메인) 이름입니다.
[[routes]]
pattern = "soerp.yeseo.im/api/*"
zone_name = "yeseo.im"

# 인증키는 여기에 적지 마세요. wrangler secret put 으로 넣습니다.
# 요청 URL을 바꿔야 할 때만 아래 주석을 풀어 쓰세요.
# [vars]
# REGION_API_URL = "https://apis.data.go.kr/1741000/StanReginCd/getStanReginCdList"
